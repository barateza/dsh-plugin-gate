name: publish

# Trusted publishing (OIDC). No npm token is stored in this repository, in
# secrets, or on any machine: the workflow exchanges a short-lived GitHub
# Actions OIDC token for a short-lived npm publish credential, and only THIS
# workflow file in THIS repository is authorized to do so (configured on the
# package's "Trusted Publisher" settings on npmjs.com).
#
# Requires npm >= 11.5.1 (Node 24 ships it; the step below upgrades anyway) and
# the `id-token: write` permission. The package must already exist — the first
# release (1.3.3) was bootstrapped with `npm stage publish` plus a manual
# approval, because a trusted publisher cannot be configured for a package that
# does not exist yet.
#
# This repository's trusted publisher is configured for STAGED PUBLISH ONLY
# (`npm publish` is deliberately NOT granted). CI therefore submits the version
# to the staging area and a maintainer approves it on npmjs.com with a security
# key: proof-of-presence stays with a human, while no token exists anywhere.
# `npm stage publish` is always allowed by a trusted publisher.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest && npm --version

      # `npm install`, not `npm ci`: no lockfile is tracked (see test.yml).
      - run: npm install

      - run: npm test

      - run: npm stage publish --access public --provenance
