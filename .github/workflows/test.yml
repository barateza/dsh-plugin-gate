name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          # No `cache: npm`: it requires package-lock.json / npm-shrinkwrap.json,
          # and neither is tracked here — the step failed with "Dependencies lock
          # file is not found" before any test ran. Restore it together with a
          # committed lockfile if you want npm's download cache back.
      # `npm install`, not `npm ci`: `npm ci` also requires a lockfile and exits
      # with EUSAGE without one. Switch back to `npm ci` once a lockfile is
      # tracked — it is stricter and faster.
      - run: npm install
      # `npm test` (the package script) rather than `node --test test/`: on the
      # runner's Node 22 the directory argument was resolved as a module path
      # ("Cannot find module .../test"), so the suite never ran. The script also
      # lists the files explicitly, so a new test file cannot be silently missed.
      - run: npm test
